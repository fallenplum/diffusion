# Phase 1.5R repaired confirmatory protocol.  Raw data are injected through
# DIFFUSION_DATA_ROOT and are never committed.
experiment_id: phase1_5r_confirmatory_repair
data_root_env: DIFFUSION_DATA_ROOT
endpoint: dss
split:
  source: outputs/phase1r_confirmatory_20260828/split/confirmatory_patient_manifest.csv
  folds: 5
  patient_level: true
  reuse_frozen_phase1r: true
information_budget:
  raw_feature_dim: 1536
  main_tokens: 1024
  token_grid: [128, 256, 512, 1024]
  projection_grid: [random64, learned64, learned256, learned512]
  eval_sampling_repeats: 5
sampling:
  train: stochastic_without_replacement_sorted_indices
  eval: deterministic_repeated_subsampling
  multi_slide: slide_first_then_mean
training:
  optimizer: AdamW
  weight_decay: 0.0001
  learning_rates: [0.0003, 0.0001, 0.00003]
  max_epochs: 50
  early_stopping_patience: 8
  gradient_clip_norm: 1.0
statistics:
  primary_metrics: [harrell_c, uno_c]
  bootstrap_replicates: 5000
  uno_censoring: outer_train_censoring_km
methods:
  - B0_full
  - B0_1024
  - B1_GatedABMIL
  - B2_PlainABMIL
  - B3_TransformerMIL_reimplementation
  - B4_MambaMIL
  - B5_PANTHER_style_GMM
  - B6_SpatialNeighborhoodMIL
  - B7a_GatedABMIL_Cox
  - B7b_GatedABMIL_CoxRank
