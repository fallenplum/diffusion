schema_version: 1
phase: phase1r-confirmatory

objective:
  primary: Confirm whether the Phase P1 P0_nocoords frozen representation survives a new patient-level outer split before it is promoted into multimodal Phase P2.
  scope_note: This is a split-replication on the same TCGA cohort, not an independent external-cohort validation.

split:
  n_folds: 5
  outer_seed: 20260828
  stratify_on: dss_status
  shuffle: true

reproducibility:
  model_seed: 20260723

encoder:
  input_dim: 1536
  projection_dim: 256
  heads: 8
  layers: 2
  ffn_dim: 512
  dropout: 0.1
  max_tokens: 1024
  pooling: cls

sampling:
  evaluation_seeds: [11, 23, 47, 89]

ssl:
  mask_type: spatial
  mask_ratio: 0.40
  max_epochs: 50
  patience: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  compared_variants:
    - P0_nocoords
    - P0_coords

survival:
  max_epochs: 20
  patience: 5
  learning_rate_candidates: [0.0001, 0.0003]
  risk_set_comparators: 7
  b1_loss: cox

b0:
  pca_components: [16, 32, 64]

probe:
  pca_components: 32

cox:
  alpha_grid: [0.0001, 0.001, 0.01, 0.1, 1.0]

statistics:
  bootstrap_replicates: 1000
  primary_metrics:
    - harrell_c
    - uno_c

decision:
  min_positive_folds_per_metric: 3
  rule: >-
    Promote P0_nocoords only if its OOF Harrell C and Uno C are both above B0_mean
    and it beats B0_mean in at least 3 of 5 folds on each metric. Otherwise test the
    same gate for B1_ABMIL; if neither passes, lock B0_mean as the pathology branch
    for Phase P2. Bootstrap intervals are reported as uncertainty evidence but are
    not used as an after-the-fact tuning criterion.
