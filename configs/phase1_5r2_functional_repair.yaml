# Phase 1.5R2 functional Cox repair. Raw TCGA data are injected through
# DIFFUSION_DATA_ROOT and are never committed.
experiment_id: phase1_5r2_functional_repair
data_root_env: DIFFUSION_DATA_ROOT
scope:
  repair: Cox analytic gradient sign and fresh Phase1R B1 anchor
  reuse_unaffected: [B0_full, B0_1024, B5_PANTHER_style_GMM]
  no_phase2: true
  no_tri_modal: true
  no_pan_cancer: true
cohort:
  split_source: outputs/phase1r_confirmatory_20260828/split/confirmatory_patient_manifest.csv
  patient_level: true
  frozen_phase1r_split: true
information_budget:
  raw_feature_dim: 1536
  main_tokens: 1024
  token_grid: [128, 256, 512, 1024]
  projection_grid: [random64, learned64, learned256, learned512]
  eval_sampling_repeats: 5
training:
  optimizer: AdamW
  weight_decay: 0.0001
  learning_rates: [0.0003, 0.0001, 0.00003]
  max_epochs: 50
  early_stopping_patience: 8
  gradient_clip_norm: 1.0
seeds: [20260723, 20260724, 20260725]
folds: [1, 2, 3, 4, 5]
statistics:
  primary_metrics: [harrell_c, uno_c]
  bootstrap_replicates: 5000
  uno_censoring: outer_train_censoring_km
