name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt

      - name: Compile source tree
        run: python -m compileall -q src

      - name: Smoke-test statistical utilities
        run: python -c "import sys; sys.path.insert(0, 'src'); import phase1_utils; assert callable(phase1_utils.harrell_c); assert callable(phase1_utils.uno_c)"

      - name: Verify protected data is absent
        shell: bash
        run: |
          test ! -d TCGA
          test ! -d data
          if find . -type f \( -name '*.h5' -o -name '*.hdf5' -o -name '*.npy' -o -name '*.npz' -o -name '*.pt' -o -name '*.pth' \) -print -quit | grep -q .; then
            echo 'Protected or model binary found in tracked checkout'
            exit 1
          fi
