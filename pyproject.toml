[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-research"
version = "0.1.0"
description = "Reproducible pathology-only research infrastructure for the diffusion project"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["outputs", "TCGA", "data", ".git_local"]

[tool.ruff.lint]
# Existing research scripts are intentionally kept structurally stable.  This
# catches syntax/import correctness without forcing a broad algorithm rewrite.
# Keep the legacy research scripts structurally stable while still catching
# syntax errors and undefined names in every source/test file.
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
