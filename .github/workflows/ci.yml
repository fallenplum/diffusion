name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          # Tests import the real ContextEncoder/ABMIL.  Use the official CPU
          # index so ordinary CI never pulls a CUDA wheel or a model artifact.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch>=2.4,<2.6"
          python -m pip install -r requirements-ci.txt

      - name: Compile source tree
        run: python -m compileall -q src scripts tests

      - name: Lint source and tests
        run: ruff check src tests scripts

      - name: Run CPU test suite
        run: pytest -q

      - name: Validate request without running an experiment
        run: python scripts/run_research_experiment.py --request automation/requests/example_phase1_smoke.yaml --dry-run

      - name: Verify protected data is absent
        run: python scripts/check_protected_data.py
