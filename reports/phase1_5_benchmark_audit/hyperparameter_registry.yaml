# Phase 1.5 pre-registered hyperparameters
# Official references are recorded as provenance; local survival adaptation is never called official reproduction.
B0_mean:
  source: local sanity baseline
  fixed_params: {cox: ridge_penalized, preprocessing: train_only_standard_scaler_plus_PCA32}
  search_space: {alpha: [0.0001, 0.001, 0.01, 0.1, 1.0]}
  selected_by: inner_validation_harrell
B0b_mean_std:
  source: local sanity baseline
  fixed_params: {features: mean_plus_std, pca_components: 32, preprocessing: train_only}
  search_space: {alpha: [0.0001, 0.001, 0.01, 0.1, 1.0]}
  selected_by: inner_validation_harrell
B1_ABMIL:
  source: standard attention MIL
  fixed_params: {input_projection: 64, hidden: 64, max_tokens: 128, optimizer: AdamW, weight_decay: 0.0001, max_epochs: 50, patience: 7}
  search_space: {lr: [0.0003, 0.0001]}
  selected_by: inner_validation_harrell
B2_GatedABMIL:
  source: gated attention formula in Phase1.5 prompt
  fixed_params: {input_projection: 64, hidden: 64, max_tokens: 128, optimizer: AdamW, weight_decay: 0.0001, max_epochs: 50, patience: 7}
  search_space: {lr: [0.0003, 0.0001]}
  selected_by: inner_validation_harrell
B3_CLAM_SB_survival:
  source: https://github.com/mahmoodlab/CLAM
  fixed_params: {status: FAILED_TO_REPRODUCE, diagnostic_adaptation_excluded: true}
  search_space: {}
  selected_by: official_survival_adaptation_unavailable
B4_TransMIL:
  source: https://github.com/szc19990412/TransMIL
  fixed_params: {layers: 2, heads: 4, max_tokens: 128, positional_encoding: coordinate_mlp, token_cap: deterministic_uniform_order_preserving}
  search_space: {lr: [0.0003, 0.0001]}
  selected_by: inner_validation_harrell
B5_MambaMIL:
  source: https://github.com/isyangshu/MambaMIL
  fixed_params: {status: FAILED_TO_REPRODUCE}
  search_space: {}
  selected_by: not_run_due_to_missing_official_dependency
B6_PANTHER_GMM:
  source: https://github.com/mahmoodlab/PANTHER
  fixed_params: {covariance_type: diag, max_tokens: 128, prototype_fit: outer_train_only}
  search_space: {prototype_count: [4, 8]}
  selected_by: inner_validation_harrell
B7_PAMoE:
  source: https://github.com/wjx-error/PAMoE
  fixed_params: {status: FAILED_TO_REPRODUCE}
  search_space: {}
  selected_by: not_run_due_to_missing_current_assets
B8_EAGLE_spatial:
  source: paper-faithful MASE/neighborhood equivalent; official code unavailable
  fixed_params: {neighbor_k: 8, coordinate_source: raw_h5, max_tokens: 128}
  search_space: {lr: [0.0003, 0.0001]}
  selected_by: inner_validation_harrell
B9a_ABMIL_Cox:
  source: fixed ABMIL comparator
  fixed_params: {alias_of: B1_ABMIL, rank_pairs: none}
  search_space: {}
  selected_by: fixed
B9b_ABMIL_CoxRank:
  source: fixed ABMIL comparator plus comparable-pair ranking
  fixed_params: {rank_pairs: event_i_and_Ti_less_than_Tj, max_epochs: 50, patience: 7}
  search_space: {lr: [0.0003, 0.0001], lambda_rank: [0.05, 0.2]}
  selected_by: inner_validation_harrell
