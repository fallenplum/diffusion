[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "r4-multimodal-survival-cn"
version = "1.0.0"
description = "Feature-level pathology-omics-clinical DSS risk analysis software"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2"]
[project.scripts]
r4surv = "r4surv.cli:main"
[tool.setuptools.packages.find]
include = ["r4surv*"]
